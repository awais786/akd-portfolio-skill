[project]
name = "akd-app"
version = "0.1.0"
description = "Read-only AKD TradeCast portfolio fetch (holdings, cash, order history) as a Claude skill."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
akd-app = "akd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akd"]
include = ["src/akd/public.key"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: talks to the real AKD broker; skipped unless run with -m live"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "B008"]
